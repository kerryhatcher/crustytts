[dependencies.base64]
version = "0.22"

# crustytts patch: real eSpeak NG G2P (pure Rust, data embedded at compile time).
# Replaces the in-tree hand-rolled english_g2p, whose 80-word dictionary
# mispronounced most real text ("Claude" -> klæjuːd instead of klˈɔːd).
[dependencies.espeak-ng]
version = "0.1.2"
features = ["bundled-data"]

[dependencies.candle-core]
version = "0.10.2"

[dependencies.candle-nn]
version = "0.10.2"

[dependencies.candle-transformers]
version = "0.10.2"

[dependencies.kana2phone]
version = "0.3"
optional = true

[dependencies.lindera]
version = "2.3.4"
features = ["embed-ipadic"]
optional = true
default-features = false

[dependencies.nanomp3]
version = "0.1.1"

[dependencies.pinyin]
version = "0.11"
features = [
    "plain",
    "with_tone_num_end",
]
optional = true
default-features = false

[dependencies.reqwest]
version = "0.12"
features = [
    "blocking",
    "rustls-tls",
]
optional = true
default-features = false

[dependencies.rustc-hash]
version = "1.1"

[dependencies.rustfft]
version = "6"

[dependencies.safetensors]
version = "0.7.0"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.thiserror]
version = "2"

[dependencies.tiktoken-rs]
version = "0.9.1"

[dependencies.tokenizers]
version = "0.22.2"

[dependencies.tracing]
version = "0.1"

[dependencies.zip]
version = "7.2"
default-features = false

[dev-dependencies.anyhow]
version = "1"

[dev-dependencies.hound]
version = "3.5"

[dev-dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "macros",
]
