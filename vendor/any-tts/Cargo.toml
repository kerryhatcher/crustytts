[package]
edition = "2021"
rust-version = "1.83"
name = "any-tts"
version = "0.1.2"
build = false
include = [
    "/README.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/examples/**",
    "/src/**",
    "/tests/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Rust TTS library with Candle backends and runtime adapters for modern open TTS models"
homepage = "https://flow-like.com"
documentation = "https://docs.rs/any-tts"
readme = "README.md"
keywords = [
    "tts",
    "text-to-speech",
    "candle",
    "ml",
    "audio",
]
categories = [
    "multimedia::audio",
    "science",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TM9657/any-tts"

[package.metadata.docs.rs]
no-default-features = true
features = ["download"]

[features]
accelerate = [
    "candle-core/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
default = [
    "qwen3-tts",
    "kokoro",
    "omnivoice",
    "vibevoice",
    "voxtral",
    "download",
]
download = ["dep:reqwest"]
kokoro = [
    "dep:kana2phone",
    "dep:lindera",
    "dep:pinyin",
]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]
omnivoice = []
qwen3-tts = []
vibevoice = []
voxtral = []

[lib]
name = "any_tts"
path = "src/lib.rs"

[[example]]
name = "benchmark_omnivoice"
path = "examples/benchmark_omnivoice.rs"
required-features = ["omnivoice"]

[[example]]
name = "denoise_audio"
path = "examples/denoise_audio.rs"

[[example]]
name = "generate_comparison_suite"
