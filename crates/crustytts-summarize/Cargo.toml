[package]
name = "crustytts-summarize"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Transcript summarization for TTS notifications: extracts the last thing Claude did into a single spoken sentence."
keywords = ["tts", "summarize", "claude"]
categories = ["text-processing"]
repository = "https://github.com/kerryhatcher/crustytts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
