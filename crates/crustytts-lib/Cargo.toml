[package]
name = "crustytts-lib"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pluggable English text-to-speech for Kokoro: phonemizer that never silently drops a word, tokenizer, ONNX synthesizer, and audio sink — usable together or one at a time."
keywords = ["tts", "g2p", "phoneme", "kokoro", "speech"]
categories = ["text-processing", "multimedia::audio"]
repository = "https://github.com/kerryhatcher/crustytts"
readme = "README.md"

[features]
# Phonemizer + tokenizer only. No ONNX Runtime, no model download, fast build.
default = ["phonemize"]

# Text -> phonemes. The Misaki dictionary and POS tagger.
phonemize = ["dep:voice-g2p"]

# Phonemes -> audio. Pulls in ONNX Runtime.
kokoro-onnx = ["dep:ort"]

# Everything.
full = ["phonemize", "kokoro-onnx"]

[dependencies]
serde_json = "1"

voice-g2p = { version = "0.2.2", optional = true }

# Pinned deliberately. Newer release candidates ship a prebuilt ONNX Runtime
# built against glibc >= 2.38, which fails to link on older distributions
# (undefined __isoc23_strtol). rc.10's prebuilt links cleanly and is statically
# linked, so the resulting binary needs no system ONNX install.
ort = { version = "=2.0.0-rc.10", optional = true }
