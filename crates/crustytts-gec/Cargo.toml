[package]
name = "crustytts-gec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "T5-small ONNX grammar error correction for TTS proofreading"
keywords = ["tts", "gec", "grammar", "onnx", "text-processing"]
categories = ["text-processing"]

[features]
default = []
# Enable ONNX-based T5 inference (requires ONNX Runtime shared library)
onnx = ["dep:ort", "dep:tokenizers"]

[dependencies]
crustytts-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
