[package]
name = "crustytts-gec"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "T5-small ONNX grammar error correction for TTS proofreading"
keywords = ["tts", "gec", "grammar", "onnx", "t5", "text-processing"]
categories = ["text-processing"]
repository = "https://github.com/kerryhatcher/crustytts"

[features]
default = []
# Enable ONNX-based T5 inference (requires ONNX Runtime shared library)
onnx = ["dep:ort", "dep:tokenizers"]

[dependencies]
crustytts-core = { version = "0.1.0", path = "../crustytts-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Optional ONNX inference (version pinned to match crustytts-kokoro)
ort = { version = "=2.0.0-rc.10", optional = true }
tokenizers = { version = "0.21", optional = true }
