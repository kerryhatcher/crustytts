[package]
name = "crustytts-phonemize"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "English G2P for Kokoro TTS: Misaki dictionary + POS tagger + letter-spelling safety net that never silently drops a word."
keywords = ["tts", "g2p", "phoneme", "kokoro"]
categories = ["text-processing"]

[features]
default = []
# Enable the Ollama-based OOV phonemizer for words the dictionary doesn't know.
oov-llm = ["dep:reqwest", "dep:serde", "dep:serde_json"]
# Enable loading CustomMapping from a JSON file.
json-import = ["dep:serde", "dep:serde_json"]

[dependencies]
crustytts-core.workspace = true
crustytts-normalize.workspace = true
voice-g2p.workspace = true
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
