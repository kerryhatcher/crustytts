[package]
name = "crustytts-spellcheck"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-strategy English spell checking: dictionary + edit-distance + LLM, with optional symspell, spellbook (Hunspell), nlprule, and harper-core backends."
keywords = ["spellcheck", "spelling", "text-processing", "tts"]
categories = ["text-processing"]

[features]
default = ["full"]
full = ["symspell", "spellbook", "nlprule", "harper", "ollama"]

# Ollama-backed LlmProvider. Only this pulls in an HTTP client; implement
# LlmProvider yourself to use the verification stage without reqwest.
ollama = ["dep:reqwest"]

# Frequency-weighted symmetric-delete spelling correction.
symspell = ["dep:symspell"]

# Hunspell-compatible dictionary with affix rules (needs .aff/.dic files at runtime).
spellbook = ["dep:spellbook"]

# Rule-based grammar checking via LanguageTool rules (needs pre-built .bin files at runtime).
nlprule = ["dep:nlprule"]

# Modern grammar + spelling checker from Automattic.
harper = ["dep:harper-core"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, optional = true }
symspell = { workspace = true, optional = true }
spellbook = { workspace = true, optional = true }
nlprule = { workspace = true, optional = true }
harper-core = { workspace = true, optional = true }
