[package]
name = "crustytts-tokenizer"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Kokoro-82M phoneme-to-token-id mapping with compile-time embedded vocabulary."
keywords = ["tts", "tokenizer", "kokoro"]
categories = ["text-processing"]
repository = "https://github.com/kerryhatcher/crustytts"

[dependencies]
crustytts-core = { version = "0.2.0", path = "../crustytts-core" }
serde_json = "1"
