[package]
name = "crustytts"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "crustytts"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
anyhow = "1"
any-tts = { version = "0.1", features = ["kokoro", "download"] }
fs2 = "0.4"

# Local fork of any-tts. Upstream's Kokoro backend ships a hand-rolled English
# G2P with an 80-word dictionary that mispronounces most real text; the fork
# routes English through a real eSpeak NG port instead. See
# vendor/any-tts/src/models/kokoro/espeak_compat.rs.
[patch.crates-io]
any-tts = { path = "vendor/any-tts" }
