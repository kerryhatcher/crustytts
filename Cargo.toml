[workspace]
members = ["crates/crustytts-lib"]

[package]
name = "crustytts"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "crustytts"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
anyhow = "1"
fs2 = "0.4"
crustytts-lib = { version = "0.1.0", path = "crates/crustytts-lib", features = ["full"] }
