[workspace]
members = [
    "crates/crustytts-core",
    "crates/crustytts-normalize",
    "crates/crustytts-phonemize",
    "crates/crustytts-tokenizer",
    "crates/crustytts-kokoro",
    "crates/crustytts-sink",
    "crates/crustytts-voice",
    "crates/crustytts-summarize",
    "crates/crustytts-spellcheck",
    "crates/crustytts-chatspeak",
    "crates/crustytts-sentence",
    "crates/crustytts-gec",
    "crates/crustytts-codespell",
]

[package]
name = "crustytts"
version = "0.3.0"
edition = "2021"
description = "Claude Code Stop hook TTS announcer — summarizes session transcripts and speaks them aloud via Kokoro-82M neural TTS. No Python, no cloud, no API keys."
license = "MIT"
repository = "https://github.com/kerryhatcher/crustytts"
homepage = "https://github.com/kerryhatcher/crustytts"
keywords = ["tts", "claude", "kokoro", "text-to-speech", "notifications"]
categories = ["text-processing", "multimedia::audio", "command-line-utilities"]

[[bin]]
name = "crustytts"
path = "src/main.rs"

[[example]]
name = "speak"
path = "examples/speak.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
fs2 = "0.4"
crustytts-core = { version = "0.2.0", path = "crates/crustytts-core" }
crustytts-normalize = { version = "0.2.0", path = "crates/crustytts-normalize" }
crustytts-phonemize = { version = "0.3.0", path = "crates/crustytts-phonemize", features = ["oov-llm", "json-import"] }
crustytts-tokenizer = { version = "0.2.0", path = "crates/crustytts-tokenizer" }
crustytts-kokoro = { version = "0.2.0", path = "crates/crustytts-kokoro" }
crustytts-sink = { version = "0.2.0", path = "crates/crustytts-sink" }
crustytts-voice = { version = "0.2.0", path = "crates/crustytts-voice" }
crustytts-summarize = { version = "0.2.0", path = "crates/crustytts-summarize" }
crustytts-spellcheck = { version = "0.2.0", path = "crates/crustytts-spellcheck" }
crustytts-chatspeak = { version = "0.2.0", path = "crates/crustytts-chatspeak" }
crustytts-sentence = { version = "0.2.0", path = "crates/crustytts-sentence" }
crustytts-gec = { version = "0.2.0", path = "crates/crustytts-gec" }
crustytts-codespell = { version = "0.2.0", path = "crates/crustytts-codespell" }
