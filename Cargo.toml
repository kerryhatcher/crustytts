[workspace]
members = [
    "crates/crustytts-core",
    "crates/crustytts-normalize",
    "crates/crustytts-phonemize",
    "crates/crustytts-tokenizer",
    "crates/crustytts-kokoro",
    "crates/crustytts-sink",
    "crates/crustytts-voice",
    "crates/crustytts-summarize",
    "crates/crustytts-spellcheck",
    "crates/crustytts-chatspeak",
    "crates/crustytts-sentence",
    "crates/crustytts-gec",
    "crates/crustytts-codespell",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/kerryhatcher/crustytts"

[workspace.dependencies]
# ── external ───────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
fs2 = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
ort = { version = "=2.0.0-rc.10" }
tokenizers = "0.21"
voice-g2p = "0.2.2"
symspell = "0.5"
spellbook = "0.4"
nlprule = "0.6"
harper-core = "2"

# ── internal (lockstep) ────────────────────────────────────────────────────
crustytts-core = { version = "0.3.3", path = "crates/crustytts-core" }
crustytts-normalize = { version = "0.3.3", path = "crates/crustytts-normalize" }
crustytts-phonemize = { version = "0.3.3", path = "crates/crustytts-phonemize" }
crustytts-tokenizer = { version = "0.3.3", path = "crates/crustytts-tokenizer" }
crustytts-kokoro = { version = "0.3.3", path = "crates/crustytts-kokoro" }
crustytts-sink = { version = "0.3.3", path = "crates/crustytts-sink" }
crustytts-voice = { version = "0.3.3", path = "crates/crustytts-voice" }
crustytts-summarize = { version = "0.3.3", path = "crates/crustytts-summarize" }
crustytts-spellcheck = { version = "0.3.3", path = "crates/crustytts-spellcheck" }
crustytts-chatspeak = { version = "0.3.3", path = "crates/crustytts-chatspeak" }
crustytts-sentence = { version = "0.3.3", path = "crates/crustytts-sentence" }
crustytts-gec = { version = "0.3.3", path = "crates/crustytts-gec" }
crustytts-codespell = { version = "0.3.3", path = "crates/crustytts-codespell" }

# ── root package (crustytts binary) ──────────────────────────────────────────

[package]
name = "crustytts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Claude Code Stop hook TTS announcer — summarizes session transcripts and speaks them aloud via Kokoro-82M neural TTS. No Python, no cloud, no API keys."
homepage = "https://github.com/kerryhatcher/crustytts"
keywords = ["tts", "claude", "kokoro", "text-to-speech", "notifications"]
categories = ["text-processing", "multimedia::audio", "command-line-utilities"]

[[bin]]
name = "crustytts"
path = "src/main.rs"

[[example]]
name = "speak"
path = "examples/speak.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
fs2.workspace = true
crustytts-core.workspace = true
crustytts-normalize.workspace = true
crustytts-phonemize = { workspace = true, features = ["oov-llm", "json-import"] }
crustytts-tokenizer.workspace = true
crustytts-kokoro.workspace = true
crustytts-sink.workspace = true
crustytts-voice.workspace = true
crustytts-summarize.workspace = true
crustytts-spellcheck.workspace = true
crustytts-chatspeak.workspace = true
crustytts-sentence.workspace = true
crustytts-gec.workspace = true
crustytts-codespell.workspace = true
flate2 = "1.1"
